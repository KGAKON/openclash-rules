ruleset=手动选择,clash-classic:http://192.168.100.110:8801/d/openclash-rules/my_custom_proxy.yaml?sign=f2p_fK7SNcLAYbl-EkvHTZxGYKiRX9aRp4JiIbPKBg8=:0,3600
uleset=手动选择,clash-classic:http://192.168.100.110:8801/d/openclash-rules/my_custom_proxy.yaml?sign=f2p_fK7SNcLAYbl-EkvHTZxGYKiRX9aRp4JiIbPKBg8=:0,3600
