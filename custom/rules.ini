ruleset=DIRECT,clash-classic:http://192.168.100.110:8801/d/openclash-rules/my_custom_direct.yaml?sign=Qty9fMEvc-ZPjXYeWGHv5cAvI2Ow2s4u5xmB9hj9BtE=:0,3600
